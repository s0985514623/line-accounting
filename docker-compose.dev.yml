# 本機開發 / 測試用 PostgreSQL 17（僅開發機；正式環境使用 VPS 共用 PostgreSQL）
#
# 啟動：docker compose -f docker-compose.dev.yml up -d
# 停止：docker compose -f docker-compose.dev.yml down        （保留資料）
# 重置：docker compose -f docker-compose.dev.yml down -v     （清除 volume）
#
# 連線資訊（預設 port 5433；被占用時可用 DEV_DB_PORT 覆寫，並同步調整 URL）
#   測試 DB（BDD / 單元 / DB 測試；會被 TRUNCATE，勿放開發資料）
#     TEST_DATABASE_URL=postgresql://test:test@localhost:5433/test
#   開發 DB
#     DATABASE_URL=postgresql://test:test@localhost:5433/line_accounting_dev
#
# 注意：初始化 SQL 只在 volume 首次建立時執行；若 volume 已存在請先 down -v。
services:
  db:
    image: postgres:17
    container_name: line-accounting-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test # 獨立的 test database
      TZ: UTC
    ports:
      - '${DEV_DB_PORT:-5434}:5432'
    volumes:
      - line_accounting_dev_pgdata:/var/lib/postgresql/data
    configs:
      - source: create_dev_database
        target: /docker-entrypoint-initdb.d/01-create-dev-database.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d test']
      interval: 3s
      timeout: 3s
      retries: 20

configs:
  create_dev_database:
    content: |
      CREATE DATABASE line_accounting_dev OWNER test;

volumes:
  line_accounting_dev_pgdata:
